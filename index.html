<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<title>ميد طفيليات</title>
<meta name="description" content="اختبارات اختيار من متعدد لمحاضرات الطفيليات: 10 أسئلة لكل محاضرة مع النتيجة والإجابات الصحيحة والترجمة العربية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e13'/%3E%3Cpath d='M32 8c11 0 15 7 20 11s6 14 1 21-6 15-19 17S11 52 9 41s1-17 6-24S21 8 32 8z' fill='%232dd4bf'/%3E%3Ccircle cx='34' cy='32' r='8' fill='%230a0e13'/%3E%3Ccircle cx='34' cy='32' r='2.6' fill='%232dd4bf'/%3E%3Ccircle cx='20' cy='42' r='4' fill='%23ff8a5b'/%3E%3C/svg%3E">
<style>
  @property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
  :root {
    --bg: #0a0e13;
    --surface: #111921;
    --surface-2: #16202a;
    --surface-3: #1c2834;
    --ink: #e8eef4;
    --muted: #93a1af;
    --line: #213040;
    --line-2: #2d3f52;
    --teal: #2dd4bf;
    --teal-soft: rgba(45, 212, 191, .12);
    --teal-ink: #03211c;
    --coral: #ff8a5b;
    --coral-soft: rgba(255, 138, 91, .13);
    --coral-ink: #2b0f03;
    --sky: #7dd3fc;
    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, .13);
    --bad: #fb7185;
    --bad-soft: rgba(251, 113, 133, .13);
    --acc: var(--teal);
    --acc-soft: var(--teal-soft);
    --acc-ink: var(--teal-ink);
    color-scheme: dark;
  }
  body[data-group="lab"], .lab { --acc: var(--coral); --acc-soft: var(--coral-soft); --acc-ink: var(--coral-ink); }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(720px 420px at 100% -6%, rgba(45, 212, 191, .17), transparent 62%),
      radial-gradient(560px 420px at -8% 6%, rgba(255, 138, 91, .12), transparent 62%),
      radial-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px);
    background-size: auto, auto, 22px 22px;
    background-repeat: no-repeat, no-repeat, repeat;
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
  .en { direction: ltr; unicode-bidi: isolate; }
  [hidden] { display: none !important; }
  bdi { white-space: nowrap; }

  /* Header */
  .top {
    position: sticky; top: 0; z-index: 5;
    background: rgba(10, 14, 19, .72);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
  }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; text-align: right; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(145deg, #12302c, #0d1a20); border: 1px solid #1f4440;
    box-shadow: 0 0 22px -6px rgba(45, 212, 191, .55);
  }
  .brand .logo svg { width: 26px; height: 26px; }
  .brand b { display: block; font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
  .brand small { display: block; font-size: .74rem; color: var(--muted); letter-spacing: .02em; }
  .top-pill { font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }

  main { padding: 22px 0 48px; }

  /* Hero */
  .hero { display: flex; align-items: center; gap: 14px; margin: 6px 0 4px; }
  .hero-text { flex: 1; min-width: 0; }
  .hero h1 { font-size: clamp(1.5rem, 5.4vw, 2.25rem); line-height: 1.25; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; }
  .grad {
    background: linear-gradient(90deg, var(--coral), #fbbf77 30%, var(--sky) 65%, var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin: 0 0 14px; color: var(--muted); max-width: 520px; }
  .hero-art { flex: none; width: 128px; }
  .hero-art svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 10px 28px rgba(45, 212, 191, .28)); animation: wobble 7s ease-in-out infinite; transform-origin: 50% 55%; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50% { transform: rotate(3deg) scale(1.04); }
  }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: .82rem; padding: 4px 12px; border-radius: 999px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); color: var(--muted); }
  .pill b { color: var(--ink); font-weight: 600; }
  @media (max-width: 420px) { .hero-art { width: 92px; } }

  .group-title { display: flex; align-items: center; gap: 10px; font-size: .95rem; font-weight: 600; margin: 28px 0 12px; color: var(--ink); }
  .group-title .dot-c { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); }
  .group-title small { color: var(--muted); font-weight: 400; }
  .group-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to left, var(--line), transparent); }

  .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 660px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    position: relative; overflow: hidden;
    display: flex; gap: 14px; align-items: flex-start; width: 100%;
    text-align: right; cursor: pointer;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 16px 14px;
    transition: border-color .18s, box-shadow .18s, transform .18s;
  }
  .card::before { content: ""; position: absolute; inset-block: 14px; inset-inline-start: 0; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); }
  .card::after {
    content: ""; position: absolute; width: 160px; height: 160px; inset-inline-end: -60px; top: -70px;
    background: radial-gradient(circle, var(--acc-soft), transparent 70%); pointer-events: none;
  }
  .card:hover { border-color: var(--acc); box-shadow: 0 12px 34px -18px var(--acc); transform: translateY(-2px); }
  .card:active { transform: translateY(0); }
  .ico { flex: none; width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); border: 1px solid rgba(255, 255, 255, .05); }
  .ico svg { width: 28px; height: 28px; }
  .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tag { font-size: .76rem; font-weight: 600; color: var(--acc); background: var(--acc-soft); padding: 2px 10px; border-radius: 999px; }
  .best { font-size: .76rem; color: var(--muted); }
  .best b { color: var(--ink); }
  .card-title { font-weight: 600; font-size: 1.04rem; line-height: 1.35; text-align: right; }
  .card-desc { color: var(--muted); font-size: .88rem; line-height: 1.5; }

  :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

  /* Quiz */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .quiz-head .lec { min-width: 0; }
  .quiz-head .lec .tag { display: inline-block; margin-bottom: 4px; }
  .quiz-head .lec div { font-weight: 600; line-height: 1.35; text-align: right; }
  .link-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: .88rem; white-space: nowrap; }
  .link-btn:hover { color: var(--ink); border-color: var(--line-2); }
  .meta { display: flex; justify-content: space-between; font-size: .86rem; color: var(--muted); }
  .progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
  .progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(to left, var(--acc), var(--sky)); box-shadow: 0 0 12px var(--acc); transition: width .3s; }
  .dots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin: 4px 0 16px; max-width: 440px; }
  .dot { width: 100%; aspect-ratio: 1; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; font-size: .8rem; font-weight: 600; background: var(--surface); border: 1.5px solid var(--line); color: var(--muted); }
  .dot.done { background: var(--acc-soft); border-color: transparent; color: var(--acc); }
  .dot.cur { border-color: var(--acc); color: var(--ink); }

  .qcard {
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px;
    box-shadow: 0 24px 60px -36px rgba(0, 0, 0, .9);
  }
  .field {
    background: radial-gradient(circle at 50% 42%, #21403f 0%, #142729 52%, #0c1618 100%);
    border: 1px solid #1d3536; border-radius: 14px; padding: 12px;
    display: grid; place-items: center;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, .55);
  }
  .field svg { width: 100%; max-width: 300px; height: auto; display: block; }
  .qfig { margin: 0 0 16px; }
  .fig-note { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 6px; }
  .qtext { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 0 0 16px; text-align: left; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    text-align: left; direction: ltr; cursor: pointer; line-height: 1.45;
    background: var(--surface-3); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .opt:hover { border-color: var(--line-2); }
  .opt:active { transform: scale(.99); }
  .opt .letter { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--surface); border: 1px solid var(--line-2); color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-soft); }
  .opt[aria-pressed="true"] .letter { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }

  .nav { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border-radius: 12px; padding: 12px 16px; cursor: pointer; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); }
  .btn:hover:not(:disabled) { border-color: var(--line-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); box-shadow: 0 10px 26px -14px var(--acc); }
  .btn.primary:disabled { box-shadow: none; }
  .submit-row { margin-top: 12px; }
  .submit-row .btn { width: 100%; }
  .hint { text-align: center; color: var(--muted); font-size: .84rem; margin-top: 8px; }

  /* Results */
  .score-card {
    display: flex; align-items: center; gap: 18px; padding: 22px 18px; border-radius: 18px;
    border: 1px solid var(--line);
    background: radial-gradient(420px 220px at 0% 0%, var(--ring-soft, var(--acc-soft)), transparent 70%), linear-gradient(180deg, var(--surface-2), var(--surface));
  }
  .ring {
    --p: 0;
    flex: none; width: 110px; height: 110px; border-radius: 50%;
    background: conic-gradient(var(--ring, var(--acc)) calc(var(--p) * 1%), var(--surface-3) 0);
    display: grid; place-items: center; transition: --p 1s cubic-bezier(.2, .8, .2, 1);
    box-shadow: 0 0 36px -10px var(--ring, var(--acc));
  }
  .ring > div { width: 86px; height: 86px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring b { font-size: 1.75rem; direction: ltr; display: block; }
  .ring small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .score-text h2 { margin: 0 0 4px; font-size: 1.35rem; line-height: 1.35; }
  .score-text p { margin: 0; color: var(--muted); }
  .res-actions { display: flex; gap: 10px; margin: 14px 0 20px; }
  .filter { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: .86rem; font-weight: 500; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--acc); background: var(--acc-soft); color: var(--ink); }
  .chip.tr-chip { margin-inline-start: auto; }

  .review { display: grid; gap: 12px; }
  .ritem { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-inline-start: 4px solid var(--ok); border-radius: 14px; padding: 16px; }
  .ritem.wrong { border-inline-start-color: var(--bad); }
  .rhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .84rem; font-weight: 600; }
  .badge { padding: 1px 10px; border-radius: 999px; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .ritem .qfig { margin-bottom: 12px; }
  .ritem .field svg { max-width: 220px; }
  .rq { font-weight: 600; text-align: left; margin: 0 0 10px; line-height: 1.5; }
  .rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; direction: ltr; }
  .rlist li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; line-height: 1.45; font-size: .94rem; }
  .rlist li .mk { flex: none; width: 20px; text-align: center; font-weight: 700; }
  .rlist li.correct { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .rlist li.picked-wrong { background: var(--bad-soft); color: var(--bad); }
  .rlist li.picked-wrong .txt { text-decoration: line-through; text-decoration-thickness: 1px; }
  .rlist li.plain { color: var(--muted); }
  .rlist li .who { margin-left: auto; font-size: .76rem; font-weight: 600; white-space: nowrap; direction: rtl; }
  .ex { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .025); border: 1px dashed var(--line-2); font-size: .92rem; text-align: left; direction: ltr; }
  .ex b { color: var(--acc); }
  .tr { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--acc-soft); border: 1px solid rgba(255, 255, 255, .05); font-size: .92rem; line-height: 1.75; }
  .tr div + div { margin-top: 4px; }
  .tr b { color: var(--acc); font-weight: 600; }
  .figwrap { margin-top: 10px; }
  .figwrap .cap { font-size: .84rem; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }

  .flow { direction: ltr; display: grid; gap: 6px; }
  .step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-3); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .step .n { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .74rem; font-weight: 700; background: var(--acc); color: var(--acc-ink); margin-top: 1px; }
  .step .t { font-size: .88rem; line-height: 1.45; }
  .step .ta { display: block; direction: rtl; text-align: right; color: var(--muted); font-size: .82rem; }

  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 0 0 28px; }

  @media (max-width: 420px) {
    .qtext { font-size: 1.05rem; }
    .score-card { gap: 14px; padding: 18px 14px; }
    .ring { width: 96px; height: 96px; }
    .ring > div { width: 74px; height: 74px; }
    .ring b { font-size: 1.45rem; }
    .top-pill { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
      <span class="logo" id="logo"></span>
      <span><b>ميد طفيليات</b><small class="en">Medical Parasitology Quiz</small></span>
    </button>
    <span class="top-pill">7 محاضرات · 70 سؤال</span>
  </div>
</header>

<main class="wrap">
  <!-- Home -->
  <section id="home">
    <div class="hero">
      <div class="hero-text">
        <h1>اختبر نفسك في <span class="grad">الطفيليات</span></h1>
        <p>اختر محاضرة وأجب عن 10 أسئلة. بعد إنهاء كل الأسئلة تظهر نتيجتك مع الإجابات الصحيحة والتوضيح والترجمة العربية.</p>
        <div class="pills">
          <span class="pill"><b>10</b> أسئلة لكل محاضرة</span>
          <span class="pill">أسئلة بالصور</span>
          <span class="pill">ترجمة مع النتيجة</span>
        </div>
      </div>
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
    </div>
    <div class="group-title"><span class="dot-c"></span>النظري</div>
    <div class="grid" id="grid-theory"></div>
    <div class="group-title lab"><span class="dot-c"></span>العملي</div>
    <div class="grid" id="grid-lab"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="quiz-head">
      <div class="lec">
        <span class="tag" id="qTag"></span>
        <div class="en" id="qTitle"></div>
      </div>
      <button class="link-btn" type="button" id="quitBtn">المحاضرات</button>
    </div>
    <div class="meta"><span id="qCount"></span><span id="qAnswered"></span></div>
    <div class="progress"><span id="qBar" style="width:0%"></span></div>
    <div class="dots" id="dots" aria-label="التنقل بين الأسئلة"></div>

    <div class="qcard">
      <div class="qfig" id="qFig" hidden></div>
      <p class="qtext en" id="qText" lang="en"></p>
      <div class="opts" id="opts" role="group" aria-labelledby="qText"></div>
    </div>

    <div class="nav">
      <button class="btn" type="button" id="prevBtn">السابق</button>
      <button class="btn" type="button" id="nextBtn">التالي</button>
    </div>
    <div class="submit-row">
      <button class="btn primary" type="button" id="submitBtn" disabled>عرض النتيجة</button>
      <div class="hint" id="submitHint"></div>
    </div>
  </section>

  <!-- Results -->
  <section id="result" hidden>
    <div class="quiz-head">
      <div class="lec">
        <span class="tag" id="rTag"></span>
        <div class="en" id="rTitle"></div>
      </div>
    </div>
    <div class="score-card" id="scoreCard">
      <div class="ring" id="ring"><div><span><b id="rScore"></b><small id="rPct"></small></span></div></div>
      <div class="score-text">
        <h2 id="rMsg"></h2>
        <p id="rSub"></p>
      </div>
    </div>
    <div class="res-actions">
      <button class="btn primary" type="button" id="retryBtn">أعد الاختبار</button>
      <button class="btn" type="button" id="backBtn">محاضرة أخرى</button>
    </div>
    <div class="filter" role="group" aria-label="تصفية المراجعة">
      <button class="chip" type="button" data-f="all" aria-pressed="true">كل الأسئلة</button>
      <button class="chip" type="button" data-f="wrong" aria-pressed="false" id="chipWrong">الأخطاء فقط</button>
      <button class="chip tr-chip" type="button" id="trChip" aria-pressed="true">الترجمة العربية</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>

<footer class="wrap">الأسئلة مبنية على محتوى المحاضرات السبع · الرسوم توضيحية مبسّطة</footer>

<script type="application/json" id="quiz-data">
[
  {
    "id": "l3", "group": "theory", "tag": "نظري م3", "icon": "lens",
    "title": "Infection, Diagnosis & Treatment",
    "desc": "تصنيف العدوى، استراتيجيات الطفيلي، طرق التشخيص، العلاج",
    "questions": [
      {"q": "Cross infection occurring in hospital is called:",

  function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  /* Arabic text with embedded Latin names: isolate each Latin run so names like "E. coli" keep their order */
  var LATIN = /\d+(?:\.\d+)?\s?[–-]\s?\d+(?:\.\d+)?|[A-Za-z][A-Za-z0-9.\/\-–() ]*[A-Za-z0-9)]|[A-Za-z]/g;
  function count(s, ch) { return s.split(ch).length - 1; }
  function arText(node, text) {
    var last = 0, m;
    LATIN.lastIndex = 0;
    while ((m = LATIN.exec(text))) {
      var run = m[0];
      while (run.length > 1 && run.charAt(run.length - 1) === ")" && count(run, ")") > count(run, "(")) run = run.slice(0, -1);
      if (count(run, "(") > count(run, ")")) run = run.slice(0, run.lastIndexOf("(")).replace(/\s+$/, "");
      if (!run) { LATIN.lastIndex = m.index + 1; continue; }
      if (m.index > last) node.appendChild(document.createTextNode(text.slice(last, m.index)));
      var s = document.createElement("bdi"); s.dir = "ltr"; s.textContent = run; node.appendChild(s);
      last = m.index + run.length;
      LATIN.lastIndex = last;
    }
    if (last < text.length) node.appendChild(document.createTextNode(text.slice(last)));
    return node;
  }
  function elAr(tag, cls, text) { return arText(el(tag, cls), text); }
  function show(name) { Object.keys(views).forEach(function (k) { views[k].hidden = k !== name; }); window.scrollTo(0, 0); }

  function figureNode(key, withCap) {
    var f = FIGS[key]; if (!f) return null;
    var wrap = el("div", "figwrap");
    if (f.flow) {
      var list = el("div", "flow");
      f.flow.forEach(function (s, i) {
        var st = el("div", "step");
        st.appendChild(el("span", "n", String(i + 1)));
        var t = el("div", "t", s[0]); t.lang = "en";
        t.appendChild(elAr("span", "ta", s[1]));
        st.appendChild(t);
        list.appendChild(st);
      });
      wrap.appendChild(list);
    } else {
      var fld = el("div", "field");
      fld.innerHTML = f.draw();
      wrap.appendChild(fld);
    }
    if (withCap && f.cap) wrap.appendChild(elAr("div", "cap", f.cap));
    return wrap;
  }

  /* ---------- Home ---------- */
  function renderHome() {
    document.body.removeAttribute("data-group");
    var best = readBest();
    var gT = $("grid-theory"), gL = $("grid-lab");
    gT.innerHTML = ""; gL.innerHTML = "";
    DATA.forEach(function (lec) {
      var c = el("button", "card" + (lec.group === "lab" ? " lab" : ""));
      c.type = "button";
      var ic = el("span", "ico"); ic.innerHTML = icon(lec.icon); c.appendChild(ic);
      var body = el("span", "body");
      var head = el("span", "card-head");
      head.appendChild(el("span", "tag", lec.tag));
      var b = el("span", "best");
      if (best[lec.id] != null) { b.appendChild(document.createTextNode("أفضل نتيجة: ")); b.appendChild(el("b", "en", best[lec.id] + "/" + lec.questions.length)); }
      else { b.textContent = lec.questions.length + " أسئلة"; }
      head.appendChild(b);
      body.appendChild(head);
      var t = el("span", "card-title en", lec.title); t.lang = "en";
      body.appendChild(t);
      body.appendChild(elAr("span", "card-desc", lec.desc));
      c.appendChild(body);
      c.addEventListener("click", function () { location.hash = lec.id; });
      (lec.group === "theory" ? gT : gL).appendChild(c);
    });
    show("home");
  }

  /* ---------- Quiz ---------- */
  function startQuiz(lec) {
    state.lec = lec;
    document.body.setAttribute("data-group", lec.group);
    state.items = shuffle(lec.questions).map(function (q) {
      var opts = q.o.map(function (text, i) { return { text: text, correct: i === 0 }; });
      return { q: q.q, e: q.e, qa: q.qa, aa: q.aa, ea: q.ea, img: q.img, fig: q.fig, opts: shuffle(opts) };
    });
    state.answers = state.items.map(function () { return null; });
    state.idx = 0; state.filter = "all"; state.score = null;
    $("qTag").textContent = lec.tag;
    $("qTitle").textContent = lec.title;
    renderDots(); renderQuestion(); show("quiz");
  }
  function answeredCount() { return state.answers.filter(function (a) { return a !== null; }).length; }
  function renderDots() {
    var d = $("dots"); d.innerHTML = "";
    state.items.forEach(function (_, i) {
      var b = el("button", "dot", String(i + 1)); b.type = "button";
      b.setAttribute("aria-label", "السؤال " + (i + 1));
      b.addEventListener("click", function () { clearTimeout(advanceTimer); state.idx = i; renderQuestion(); });
      d.appendChild(b);
    });
  }
  function updateChrome() {
    var n = state.items.length, done = answeredCount();
    $("qCount").textContent = "السؤال " + (state.idx + 1) + " من " + n;
    $("qAnswered").textContent = "أجبت عن " + done + " من " + n;
    $("qBar").style.width = (done / n * 100) + "%";
    Array.prototype.forEach.call($("dots").children, function (b, i) {
      b.classList.toggle("done", state.answers[i] !== null);
      b.classList.toggle("cur", i === state.idx);
      if (i === state.idx) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = state.idx === 0;
    $("nextBtn").disabled = state.idx === n - 1;
    var all = done === n;
    $("submitBtn").disabled = !all;
    $("submitHint").textContent = all ? "" : "تظهر النتيجة بعد الإجابة عن كل الأسئلة (" + (n - done) + " متبقية)";
  }
  function renderQuestion() {
    var item = state.items[state.idx];
    var qf = $("qFig"); qf.innerHTML = "";
    if (item.img) { qf.appendChild(figureNode(item.img, false)); qf.appendChild(el("div", "fig-note", "رسم توضيحي مبسّط")); qf.hidden = false; }
    else qf.hidden = true;
    $("qText").textContent = item.q;
    var box = $("opts"); box.innerHTML = "";
    item.opts.forEach(function (o, i) {
      var b = el("button", "opt"); b.type = "button"; b.lang = "en";
      b.setAttribute("aria-pressed", state.answers[state.idx] === i ? "true" : "false");
      b.appendChild(el("span", "letter", LETTERS[i]));
      b.appendChild(el("span", "", o.text));
      b.addEventListener("click", function () { choose(i); });
      box.appendChild(b);
    });
    updateChrome();
  }
  var advanceTimer = null;
  function choose(i) {
    if (i < 0 || i >= state.items[state.idx].opts.length) return;
    var first = state.answers[state.idx] === null;
    state.answers[state.idx] = i;
    Array.prototype.forEach.call($("opts").children, function (b, k) { b.setAttribute("aria-pressed", k === i ? "true" : "false"); });
    updateChrome();
    clearTimeout(advanceTimer);
    if (first) {
      var next = nextUnanswered();
      if (next !== -1) advanceTimer = setTimeout(function () { state.idx = next; renderQuestion(); }, 300);
      else advanceTimer = setTimeout(function () { $("submitBtn").focus(); }, 150);
    }
  }
  function nextUnanswered() {
    var n = state.items.length;
    for (var s = 1; s <= n; s++) { var k = (state.idx + s) % n; if (state.answers[k] === null) return k; }
    return -1;
  }

  /* ---------- Results ---------- */
  function finish() {
    if (answeredCount() !== state.items.length) return;
    var score = 0;
    state.items.forEach(function (it, i) { if (it.opts[state.answers[i]].correct) score++; });
    saveBest(state.lec.id, score);
    state.score = score; state.filter = "all";
    renderResult();
    history.replaceState(null, "", "#" + state.lec.id + "/result");
    show("result");
    var ring = $("ring");
    ring.style.setProperty("--p", 0);
    requestAnimationFrame(function () { requestAnimationFrame(function () { ring.style.setProperty("--p", Math.round(score / state.items.length * 100)); }); });
  }
  function message(score, n) {
    var p = score / n;
    if (p === 1) return ["علامة كاملة!", "أتقنت هذه المحاضرة."];
    if (p >= 0.8) return ["ممتاز", "راجع الأسئلة الخاطئة فقط."];
    if (p >= 0.6) return ["جيد", "راجع الأخطاء ثم أعد الاختبار."];
    return ["تحتاج مراجعة", "ارجع لملف المحاضرة ثم أعد الاختبار."];
  }
  function renderResult() {
    var n = state.items.length, score = state.score, pct = Math.round(score / n * 100);
    $("rTag").textContent = state.lec.tag;
    $("rTitle").textContent = state.lec.title;
    $("rScore").textContent = score + "/" + n;
    $("rPct").textContent = pct + "%";
    var good = pct >= 60;
    var sc = $("scoreCard"), ring = $("ring");
    ring.style.setProperty("--ring", good ? "var(--ok)" : "var(--bad)");
    sc.style.setProperty("--ring-soft", good ? "var(--ok-soft)" : "var(--bad-soft)");
    var m = message(score, n);
    $("rMsg").textContent = m[0]; $("rSub").textContent = m[1];
    $("chipWrong").textContent = "الأخطاء فقط (" + (n - score) + ")";
    Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function (c) { c.setAttribute("aria-pressed", c.getAttribute("data-f") === state.filter ? "true" : "false"); });
    $("trChip").setAttribute("aria-pressed", state.showTr ? "true" : "false");
    renderReview();
  }
  function trLine(label, text) {
    var d = el("div"); d.appendChild(el("b", "", label + " ")); arText(d, text); return d;
  }
  function renderReview() {
    var box = $("review"); box.innerHTML = "";
    var shown = 0;
    state.items.forEach(function (it, i) {
      var picked = state.answers[i], ok = it.opts[picked].correct;
      if (state.filter === "wrong" && ok) return;
      shown++;
      var card = el("article", "ritem" + (ok ? "" : " wrong"));
      var head = el("div", "rhead");
      head.appendChild(el("span", "", "السؤال " + (i + 1)));
      head.appendChild(el("span", "badge " + (ok ? "ok" : "bad"), ok ? "صحيحة" : "خاطئة"));
      card.appendChild(head);
      if (it.img) { var qf = el("div", "qfig"); qf.appendChild(figureNode(it.img, false)); card.appendChild(qf); }
      var q = el("p", "rq en", it.q); q.lang = "en"; card.appendChild(q);
      var ul = el("ul", "rlist"); ul.lang = "en";
      it.opts.forEach(function (o, k) {
        var li = el("li", o.correct ? "correct" : (k === picked ? "picked-wrong" : "plain"));
        li.appendChild(el("span", "mk", o.correct ? "✓" : (k === picked ? "✗" : LETTERS[k])));
        li.appendChild(el("span", "txt", o.text));
        if (k === picked) li.appendChild(el("span", "who", "إجابتك"));
        else if (o.correct) li.appendChild(el("span", "who", "الصحيحة"));
        ul.appendChild(li);
      });
      card.appendChild(ul);
      var ex = el("div", "ex"); ex.lang = "en";
      ex.appendChild(el("b", "", "Explanation: ")); ex.appendChild(document.createTextNode(it.e));
      card.appendChild(ex);
      if (state.showTr && it.qa) {
        var tr = el("div", "tr"); tr.lang = "ar";
        tr.appendChild(trLine("السؤال:", it.qa));
        tr.appendChild(trLine("الإجابة الصحيحة:", it.aa));
        tr.appendChild(trLine("التوضيح:", it.ea));
        card.appendChild(tr);
      }
      var figKey = it.img || it.fig;
      if (figKey) {
        var fn = it.img ? (function () { var w = el("div", "figwrap"); w.appendChild(elAr("div", "cap", FIGS[it.img].cap)); return w; })() : figureNode(figKey, true);
        if (fn) card.appendChild(fn);
      }
      box.appendChild(card);
    });
    if (!shown) box.appendChild(el("p", "empty", "لا توجد أخطاء. أحسنت!"));
  }

  /* ---------- Routing ---------- */
  function findLec(id) { for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i]; return null; }
  function route() {
    clearTimeout(advanceTimer);
    var h = location.hash.replace(/^#/, ""), lec = findLec(h.split("/")[0]);
    if (!lec) { state.lec = null; renderHome(); return; }
    if (h.indexOf("/result") > -1 && state.lec === lec && state.score != null) { show("result"); return; }
    startQuiz(lec);
  }

  /* ---------- Events ---------- */
  $("logo").innerHTML = logoArt();
  $("heroArt").innerHTML = heroArt();
  $("prevBtn").addEventListener("click", function () { clearTimeout(advanceTimer); if (state.idx > 0) { state.idx--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", function () { clearTimeout(advanceTimer); if (state.idx < state.items.length - 1) { state.idx++; renderQuestion(); } });
  $("submitBtn").addEventListener("click", finish);
  ["quitBtn", "homeBtn", "backBtn"].forEach(function (id) { $(id).addEventListener("click", function () { location.hash = ""; }); });
  $("retryBtn").addEventListener("click", function () { history.replaceState(null, "", "#" + state.lec.id); startQuiz(state.lec); });
  Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function (c) {
    c.addEventListener("click", function () {
      state.filter = c.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".chip[data-f]"), function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); });
      renderReview();
    });
  });
  $("trChip").addEventListener("click", function () {
    state.showTr = !state.showTr;
    store(TR_KEY, state.showTr ? "1" : "0");
    $("trChip").setAttribute("aria-pressed", state.showTr ? "true" : "false");
    renderReview();
  });
  document.addEventListener("keydown", function (ev) {
    if (views.quiz.hidden || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var k = ev.key;
    if (/^[1-4]$/.test(k)) choose(Number(k) - 1);
    else if (/^[a-dA-D]$/.test(k)) choose(k.toUpperCase().charCodeAt(0) - 65);
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
