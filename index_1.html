<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --ink: #1b1d20;
    --muted: #5c616a;
    --line: #e2ddd2;
    --brand: #1f4e79;
    --brand-ink: #ffffff;
    --brand-soft: #e5edf5;
    --ok: #176e43;
    --ok-soft: #e3f2e9;
    --bad: #b42318;
    --bad-soft: #fbe8e6;
    --shadow: 0 1px 2px rgba(20, 24, 30, .06), 0 4px 14px rgba(20, 24, 30, .05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315;
      --surface: #1a1d21;
      --surface-2: #16191c;
      --ink: #eceef0;
      --muted: #9ba2aa;
      --line: #2b3036;
      --brand: #84b6e6;
      --brand-ink: #0c1a28;
      --brand-soft: #1b2836;
      --ok: #4fca88;
      --ok-soft: #15301f;
      --bad: #f2806f;
      --bad-soft: #3a1d19;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315;
    --surface: #1a1d21;
    --surface-2: #16191c;
    --ink: #eceef0;
    --muted: #9ba2aa;
    --line: #2b3036;
    --brand: #84b6e6;
    --brand-ink: #0c1a28;
    --brand-soft: #1b2836;
    --ok: #4fca88;
    --ok-soft: #15301f;
    --bad: #f2806f;
    --bad-soft: #3a1d19;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  .top {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand b { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
  .brand small { display: block; font-size: .8rem; color: var(--muted); font-weight: 400; margin-top: -2px; }

  main { padding: 24px 0 56px; }

  /* Home */
  .intro h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 6px; font-weight: 700; }
  .intro p { margin: 0 0 22px; color: var(--muted); }
  .group-title {
    display: flex; align-items: center; gap: 10px;
    font-size: .95rem; font-weight: 600; color: var(--muted);
    margin: 26px 0 10px;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card {
    display: flex; flex-direction: column; gap: 6px;
    text-align: right;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--brand); }
  .card:active { transform: scale(.99); }
  .card:focus-visible, .opt:focus-visible, .btn:focus-visible, .dot:focus-visible, .brand:focus-visible {
    outline: 3px solid var(--brand); outline-offset: 2px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tag {
    font-size: .78rem; font-weight: 600;
    background: var(--brand-soft); color: var(--brand);
    padding: 2px 10px; border-radius: 999px;
  }
  .best { font-size: .78rem; color: var(--muted); }
  .best b { color: var(--ink); }
  .card-title { font-weight: 600; font-size: 1.05rem; line-height: 1.35; }
  .card-desc { color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .en { direction: ltr; unicode-bidi: isolate; }
  .card-title.en { text-align: right; }

  /* Quiz */
  .quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .quiz-head .lec { min-width: 0; }
  .quiz-head .lec .tag { display: inline-block; margin-bottom: 4px; }
  .quiz-head .lec div { font-weight: 600; line-height: 1.35; }
  .link-btn {
    background: none; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: .9rem; white-space: nowrap;
  }
  .link-btn:hover { color: var(--ink); border-color: var(--muted); }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
  .progress > span { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .25s; }
  .meta { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); }
  .dots { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; margin: 4px 0 16px; max-width: 420px; }
  .dot {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    border: 1.5px solid var(--line); background: var(--surface);
    font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--muted);
    display: grid; place-items: center; padding: 0;
  }
  .dot.done { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }
  .dot.cur { border-color: var(--brand); color: var(--brand); }

  .qcard {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px 18px; box-shadow: var(--shadow);
  }
  .qtext { font-size: 1.12rem; font-weight: 600; line-height: 1.5; margin: 0 0 16px; text-align: left; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    text-align: left; direction: ltr;
    background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 12px 14px; cursor: pointer; line-height: 1.45;
    transition: border-color .12s, background .12s;
  }
  .opt:hover { border-color: var(--muted); }
  .opt .letter {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: grid; place-items: center; font-size: .82rem; font-weight: 700;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  }
  .opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .opt[aria-pressed="true"] .letter { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

  .nav { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    flex: 1; border-radius: 12px; padding: 12px 16px; cursor: pointer;
    font-weight: 600; border: 1.5px solid var(--line); background: var(--surface);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .submit-row { margin-top: 12px; }
  .submit-row .btn { width: 100%; }
  .hint { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 8px; }

  /* Results */
  .score-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 18px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 18px;
  }
  .ring {
    --p: 0;
    flex: none; width: 104px; height: 104px; border-radius: 50%;
    background: conic-gradient(var(--ring-color, var(--brand)) calc(var(--p) * 1%), var(--line) 0);
    display: grid; place-items: center;
  }
  .ring > div {
    width: 82px; height: 82px; border-radius: 50%; background: var(--surface);
    display: grid; place-items: center; text-align: center; line-height: 1.1;
  }
  .ring b { font-size: 1.7rem; direction: ltr; }
  .ring small { display: block; color: var(--muted); font-size: .8rem; }
  .score-text h2 { margin: 0 0 4px; font-size: 1.3rem; line-height: 1.35; }
  .score-text p { margin: 0; color: var(--muted); }
  .res-actions { display: flex; gap: 10px; margin: 14px 0 22px; }
  .filter { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 5px 14px; cursor: pointer; font-size: .88rem; font-weight: 500;
  }
  .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }

  .review { display: grid; gap: 12px; }
  .ritem {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; border-inline-start: 4px solid var(--ok);
  }
  .ritem.wrong { border-inline-start-color: var(--bad); }
  .rhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .85rem; font-weight: 600; }
  .badge { padding: 1px 10px; border-radius: 999px; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .rq { font-weight: 600; text-align: left; margin: 0 0 10px; line-height: 1.5; }
  .rlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; direction: ltr; }
  .rlist li {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 10px; border-radius: 10px; border: 1px solid transparent; line-height: 1.45; font-size: .95rem;
  }
  .rlist li .mk { flex: none; width: 20px; text-align: center; font-weight: 700; }
  .rlist li.correct { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
  .rlist li.picked-wrong { background: var(--bad-soft); color: var(--bad); }
  .rlist li.picked-wrong .txt { text-decoration: line-through; text-decoration-thickness: 1px; }
  .rlist li.plain { color: var(--muted); }
  .rlist li .who { margin-left: auto; font-size: .78rem; font-weight: 600; white-space: nowrap; text-decoration: none; direction: rtl; }
  .ex {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: var(--surface-2); border: 1px dashed var(--line);
    font-size: .92rem; text-align: left; direction: ltr; color: var(--ink);
  }
  .ex b { color: var(--brand); }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }

  footer { color: var(--muted); font-size: .82rem; text-align: center; padding: 0 0 28px; }

  [hidden] { display: none !important; }
  @media (max-width: 420px) {
    .qtext { font-size: 1.05rem; }
    .score-card { gap: 14px; padding: 18px 14px; }
    .ring { width: 92px; height: 92px; }
    .ring > div { width: 72px; height: 72px; }
    .ring b { font-size: 1.45rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" type="button" aria-label="الصفحة الرئيسية">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 6c11 0 15 7 21 12s6 15 1 22-6 16-20 18S10 54 8 42s1-18 6-25S21 6 32 6z" fill="var(--brand)"/>
        <circle cx="34" cy="32" r="9" fill="var(--surface)"/>
        <circle cx="34" cy="32" r="3" fill="var(--brand)"/>
        <circle cx="20" cy="22" r="2.5" fill="var(--surface)" opacity=".7"/>
        <circle cx="46" cy="44" r="2" fill="var(--surface)" opacity=".7"/>
      </svg>
      <span><b>ميد طفيليات</b><small>Medical Parasitology Quiz</small></span>
    </button>
  </div>
</header>

<main class="wrap">
  <!-- Home -->
  <section id="home">
    <div class="intro">
      <h1>اختبر نفسك في محاضرات الطفيليات</h1>
      <p>اختر محاضرة، وأجب عن 10 أسئلة. بعد إنهاء كل الأسئلة تظهر نتيجتك مع الإجابات الصحيحة وتوضيح لكل سؤال.</p>
    </div>
    <div class="group-title">النظري</div>
    <div class="grid" id="grid-theory"></div>
    <div class="group-title">العملي</div>
    <div class="grid" id="grid-lab"></div>
  </section>

  <!-- Quiz -->
  <section id="quiz" hidden>
    <div class="quiz-head">
      <div class="lec">
        <span class="tag" id="qTag"></span>
        <div class="en" id="qTitle"></div>
      </div>
      <button class="link-btn" type="button" id="quitBtn">المحاضرات</button>
    </div>
    <div class="meta"><span id="qCount"></span><span id="qAnswered"></span></div>
    <div class="progress"><span id="qBar" style="width:0%"></span></div>
    <div class="dots" id="dots" aria-label="التنقل بين الأسئلة"></div>

    <div class="qcard">
      <p class="qtext en" id="qText" lang="en"></p>
      <div class="opts" id="opts" role="group" aria-labelledby="qText"></div>
    </div>

    <div class="nav">
      <button class="btn" type="button" id="prevBtn">السابق</button>
      <button class="btn" type="button" id="nextBtn">التالي</button>
    </div>
    <div class="submit-row">
      <button class="btn primary" type="button" id="submitBtn" disabled>عرض النتيجة</button>
      <div class="hint" id="submitHint"></div>
    </div>
  </section>

  <!-- Results -->
  <section id="result" hidden>
    <div class="quiz-head">
      <div class="lec">
        <span class="tag" id="rTag"></span>
        <div class="en" id="rTitle"></div>
      </div>
    </div>
    <div class="score-card">
      <div class="ring" id="ring"><div><span><b id="rScore"></b><small id="rPct"></small></span></div></div>
      <div class="score-text">
        <h2 id="rMsg"></h2>
        <p id="rSub"></p>
      </div>
    </div>
    <div class="res-actions">
      <button class="btn primary" type="button" id="retryBtn">أعد الاختبار</button>
      <button class="btn" type="button" id="backBtn">محاضرة أخرى</button>
    </div>
    <div class="filter" role="group" aria-label="تصفية المراجعة">
      <button class="chip" type="button" data-f="all" aria-pressed="true">كل الأسئلة</button>
      <button class="chip" type="button" data-f="wrong" aria-pressed="false" id="chipWrong">الأخطاء فقط</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</main>

<footer class="wrap">الأسئلة مبنية على محتوى المحاضرات السبع (نظري م3، م4، م5 — عملي م1، م2، م3، م5)</footer>

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("quiz-data").textContent);
  var LETTERS = ["A", "B", "C", "D", "E"];
  var STORE_KEY = "med-parasites-best";

  var $ = function (id) { return document.getElementById(id); };
  var views = { home: $("home"), quiz: $("quiz"), result: $("result") };

  var state = { lec: null, items: [], answers: [], idx: 0, filter: "all" };

  function readBest() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveBest(id, score) {
    try {
      var b = readBest();
      if (b[id] == null || score > b[id]) { b[id] = score; localStorage.setItem(STORE_KEY, JSON.stringify(b)); }
    } catch (e) {}
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function show(name) {
    Object.keys(views).forEach(function (k) { views[k].hidden = k !== name; });
    window.scrollTo(0, 0);
  }

  /* ---------- Home ---------- */
  function renderHome() {
    var best = readBest();
    var gT = $("grid-theory"), gL = $("grid-lab");
    gT.innerHTML = ""; gL.innerHTML = "";
    DATA.forEach(function (lec) {
      var c = el("button", "card");
      c.type = "button";
      var head = el("div", "card-head");
      head.appendChild(el("span", "tag", lec.tag));
      var b = el("span", "best");
      if (best[lec.id] != null) {
        b.appendChild(document.createTextNode("أفضل نتيجة: "));
        var s = el("b", "en", best[lec.id] + "/" + lec.questions.length);
        b.appendChild(s);
      } else {
        b.textContent = lec.questions.length + " أسئلة";
      }
      head.appendChild(b);
      c.appendChild(head);
      var t = el("div", "card-title en", lec.title);
      t.lang = "en";
      c.appendChild(t);
      c.appendChild(el("div", "card-desc", lec.desc));
      c.addEventListener("click", function () { go(lec.id); });
      (lec.group === "theory" ? gT : gL).appendChild(c);
    });
    show("home");
  }

  /* ---------- Quiz ---------- */
  function startQuiz(lec) {
    state.lec = lec;
    state.items = shuffle(lec.questions).map(function (q) {
      var opts = q.o.map(function (text, i) { return { text: text, correct: i === 0 }; });
      return { q: q.q, e: q.e, opts: shuffle(opts) };
    });
    state.answers = state.items.map(function () { return null; });
    state.idx = 0;
    state.filter = "all";
    $("qTag").textContent = lec.tag;
    $("qTitle").textContent = lec.title;
    renderDots();
    renderQuestion();
    show("quiz");
  }

  function answeredCount() {
    return state.answers.filter(function (a) { return a !== null; }).length;
  }

  function renderDots() {
    var d = $("dots");
    d.innerHTML = "";
    state.items.forEach(function (_, i) {
      var b = el("button", "dot", String(i + 1));
      b.type = "button";
      b.setAttribute("aria-label", "السؤال " + (i + 1));
      b.addEventListener("click", function () { state.idx = i; renderQuestion(); });
      d.appendChild(b);
    });
  }

  function updateChrome() {
    var n = state.items.length, done = answeredCount();
    $("qCount").textContent = "السؤال " + (state.idx + 1) + " من " + n;
    $("qAnswered").textContent = "أجبت عن " + done + " من " + n;
    $("qBar").style.width = (done / n * 100) + "%";
    Array.prototype.forEach.call($("dots").children, function (b, i) {
      b.classList.toggle("done", state.answers[i] !== null);
      b.classList.toggle("cur", i === state.idx);
      if (i === state.idx) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("prevBtn").disabled = state.idx === 0;
    $("nextBtn").disabled = state.idx === n - 1;
    var all = done === n;
    $("submitBtn").disabled = !all;
    $("submitHint").textContent = all ? "" : "تظهر النتيجة بعد الإجابة عن كل الأسئلة (" + (n - done) + " متبقية)";
  }

  function renderQuestion() {
    var item = state.items[state.idx];
    $("qText").textContent = item.q;
    var box = $("opts");
    box.innerHTML = "";
    item.opts.forEach(function (o, i) {
      var b = el("button", "opt");
      b.type = "button";
      b.lang = "en";
      b.setAttribute("aria-pressed", state.answers[state.idx] === i ? "true" : "false");
      b.appendChild(el("span", "letter", LETTERS[i]));
      b.appendChild(el("span", "", o.text));
      b.addEventListener("click", function () { choose(i); });
      box.appendChild(b);
    });
    updateChrome();
  }

  var advanceTimer = null;
  function choose(i) {
    var first = state.answers[state.idx] === null;
    state.answers[state.idx] = i;
    Array.prototype.forEach.call($("opts").children, function (b, k) {
      b.setAttribute("aria-pressed", k === i ? "true" : "false");
    });
    updateChrome();
    clearTimeout(advanceTimer);
    if (first) {
      var next = nextUnanswered();
      if (next !== -1) {
        advanceTimer = setTimeout(function () { state.idx = next; renderQuestion(); }, 280);
      } else {
        advanceTimer = setTimeout(function () { $("submitBtn").focus(); }, 150);
      }
    }
  }

  function nextUnanswered() {
    var n = state.items.length;
    for (var s = 1; s <= n; s++) {
      var k = (state.idx + s) % n;
      if (state.answers[k] === null) return k;
    }
    return -1;
  }

  /* ---------- Results ---------- */
  function finish() {
    if (answeredCount() !== state.items.length) return;
    var score = 0;
    state.items.forEach(function (it, i) { if (it.opts[state.answers[i]].correct) score++; });
    saveBest(state.lec.id, score);
    state.score = score;
    state.filter = "all";
    renderResult();
    history.replaceState(null, "", "#" + state.lec.id + "/result");
    show("result");
  }

  function message(score, n) {
    var p = score / n;
    if (p === 1) return ["علامة كاملة!", "أتقنت هذه المحاضرة."];
    if (p >= 0.8) return ["ممتاز", "راجع الأسئلة الخاطئة فقط."];
    if (p >= 0.6) return ["جيد", "راجع الأخطاء وأعد الاختبار."];
    return ["تحتاج مراجعة", "ارجع لملف المحاضرة ثم أعد الاختبار."];
  }

  function renderResult() {
    var n = state.items.length, score = state.score;
    var pct = Math.round(score / n * 100);
    $("rTag").textContent = state.lec.tag;
    $("rTitle").textContent = state.lec.title;
    $("rScore").textContent = score + "/" + n;
    $("rPct").textContent = pct + "%";
    var ring = $("ring");
    ring.style.setProperty("--p", pct);
    ring.style.setProperty("--ring-color", pct >= 60 ? "var(--ok)" : "var(--bad)");
    var m = message(score, n);
    $("rMsg").textContent = m[0];
    $("rSub").textContent = m[1];
    var wrong = n - score;
    $("chipWrong").textContent = "الأخطاء فقط (" + wrong + ")";
    Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", c.getAttribute("data-f") === state.filter ? "true" : "false");
    });
    renderReview();
  }

  function renderReview() {
    var box = $("review");
    box.innerHTML = "";
    var shown = 0;
    state.items.forEach(function (it, i) {
      var picked = state.answers[i];
      var ok = it.opts[picked].correct;
      if (state.filter === "wrong" && ok) return;
      shown++;
      var card = el("article", "ritem" + (ok ? "" : " wrong"));
      var head = el("div", "rhead");
      head.appendChild(el("span", "", "السؤال " + (i + 1)));
      head.appendChild(el("span", "badge " + (ok ? "ok" : "bad"), ok ? "صحيحة" : "خاطئة"));
      card.appendChild(head);
      var q = el("p", "rq en", it.q); q.lang = "en";
      card.appendChild(q);
      var ul = el("ul", "rlist"); ul.lang = "en";
      it.opts.forEach(function (o, k) {
        var cls = o.correct ? "correct" : (k === picked ? "picked-wrong" : "plain");
        var li = el("li", cls);
        li.appendChild(el("span", "mk", o.correct ? "✓" : (k === picked ? "✗" : LETTERS[k])));
        li.appendChild(el("span", "txt", o.text));
        if (k === picked) li.appendChild(el("span", "who", "إجابتك"));
        else if (o.correct) li.appendChild(el("span", "who", "الصحيحة"));
        ul.appendChild(li);
      });
      card.appendChild(ul);
      var ex = el("div", "ex"); ex.lang = "en";
      ex.appendChild(el("b", "", "Explanation: "));
      ex.appendChild(document.createTextNode(it.e));
      card.appendChild(ex);
      box.appendChild(card);
    });
    if (!shown) box.appendChild(el("p", "empty", "لا توجد أخطاء. أحسنت!"));
  }

  /* ---------- Routing ---------- */
  function findLec(id) {
    for (var i = 0; i < DATA.length; i++) if (DATA[i].id === id) return DATA[i];
    return null;
  }
  function go(id) { location.hash = id; }
  function route() {
    var h = location.hash.replace(/^#/, "");
    var id = h.split("/")[0];
    var lec = findLec(id);
    if (!lec) { state.lec = null; renderHome(); return; }
    if (h.indexOf("/result") > -1 && state.lec === lec && state.score != null && answeredCount() === state.items.length) {
      show("result"); return;
    }
    startQuiz(lec);
  }

  /* ---------- Events ---------- */
  $("prevBtn").addEventListener("click", function () { if (state.idx > 0) { state.idx--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", function () { if (state.idx < state.items.length - 1) { state.idx++; renderQuestion(); } });
  $("submitBtn").addEventListener("click", finish);
  $("quitBtn").addEventListener("click", function () { location.hash = ""; });
  $("homeBtn").addEventListener("click", function () { location.hash = ""; });
  $("backBtn").addEventListener("click", function () { location.hash = ""; });
  $("retryBtn").addEventListener("click", function () {
    state.score = null;
    history.replaceState(null, "", "#" + state.lec.id);
    startQuiz(state.lec);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (c) {
    c.addEventListener("click", function () {
      state.filter = c.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (x) {
        x.setAttribute("aria-pressed", x === c ? "true" : "false");
      });
      renderReview();
    });
  });
  document.addEventListener("keydown", function (ev) {
    if (views.quiz.hidden) return;
    var k = ev.key;
    if (/^[1-4]$/.test(k)) { choose(Number(k) - 1); }
    else if (/^[a-dA-D]$/.test(k)) { choose(k.toUpperCase().charCodeAt(0) - 65); }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
